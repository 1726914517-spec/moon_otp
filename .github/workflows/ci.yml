name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit toolchain
        uses: moonbitlang/setup-moonbit@v1

      - name: Show versions
        run: moon version

      - name: Check
        run: moon check

      - name: Build
        run: moon build

      - name: Test
        run: moon test

      - name: Build CLI
        run: moon build cmd/main

      - name: Build example
        run: moon build examples/totp_demo
